experiment:
  name: dual_track_refactor
  output_root: results/experiments

training:
  enabled: false
  script: finetune_llama3_ddi.py
  args:
    - --data_path
    - data/finetune_dataset_input_label_only_without_kg.json
    - --output_dir
    - results/llama3_ddi_lora_label_only_without_kg

classification_eval:
  enabled: false
  model_name: medgemma27b_text
  model_id: models/google/medgemma-27b-text-it
  test_data: data/test_augmented_data.csv
  output_dir: results/ddi_evaluation/classification
  max_new_tokens: 256

explanation_eval:
  enabled: false
  model_name: llama3_reasoning_adapter
  predictions_file: results/test_predictions/TODO_explanation_predictions.json
  output_dir: results/ddi_evaluation/explanation

judge:
  enabled: false
  model_id: qwen-max
  # api_key: ${DASHSCOPE_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  max_retries: 4
  retry_delay: 2.0
