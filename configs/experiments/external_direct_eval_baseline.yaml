# 外部大模型"直接评估"实验（跳过微调 & LoRA 推理）
#
# 用途：给出 LoRA 微调后模型的 baseline / 上限参照。同一条 test 输入，
#      让外部 LLM 直接生成 output，然后走 explanation_eval + judge。
#
# 入口：python -m apps.run_external_direct_eval --config configs/experiments/external_direct_eval_baseline.yaml

experiment:
  name: external_direct_eval_qwen_plus_no_kg
  # 报告落 data/reports/{experiment.name}/
  output_root: data/reports

# ============================================================
# 外部 LLM 生成阶段（复用 data_process/generate_outputs_distillation 的 messages / call_llm_chat）
# ============================================================
external_generation:
  # 输入使用测试集；无 KG 版本
  input: data/finetune/test/input_test_reasoning_without_kg.json
  model: qwen-plus
  # 环境变量占位：export DASHSCOPE_API_KEY=sk-xxx
  api_key: ${DASHSCOPE_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 与 pipelines/prompts 里的 generation_mode 相同，决定 system prompt 与是否喂 KG
  #   常用值：explanation_without_kg / explanation_with_kg /
  #          distill_reasoning_without_kg / distill_reasoning_with_kg / full
  generation_mode: explanation_without_kg
  ignore_kg_evidence: true
  max_new_tokens: 768
  # 0 表示不截断
  max_kg_evidence_chars: 0
  max_sentence_chars: 0
  request_timeout: 180
  request_retries: 4
  request_retry_delay: 2.0
  # 小样本 smoke 时把 limit 设小一点，例如 20；正式跑设 null / 删除
  limit: null

# ============================================================
# Agent Loop（反思-重试循环）
# ============================================================
#   逻辑：调 external_generation.model 生成 -> 立即算 faithfulness (+ 可选 judge) ->
#         如果任一 critic FAIL，就把 gap 反馈拼进 messages 再生成，最多 max_rounds 轮。
#   落盘：data/reports/{experiment.name}/inference/agent_trace_<run_id>.json
agent_loop:
  # 先完成 direct external baseline；反思-重试实验另行开启。
  enabled: false
  max_rounds: 3

  # Faithfulness 阈值：coverage>=X 且 hallucination<=Y 才算通过
  faithfulness_min_coverage: 0.4
  faithfulness_max_hallucination: 0.5

  # 是否把 LLM-as-judge 也纳入 critic（会额外调 qwen-max，成本更高）
  use_judge_critic: false
  # judge 通过阈值（0-12），mechanism_overall_score >= X 视为通过
  judge_min_overall_score: 7.0

  # 落盘时是否保留完整 messages 与 output（不截断），仅供 debug；默认省流
  keep_full_messages_in_trace: false
  verbose: true

# ============================================================
# 事实度 + LLM-as-judge 评估（复用 pipelines/explanation_pipeline.run_explanation_eval）
# ============================================================
explanation_eval:
  enabled: true
  model_name: qwen_plus_direct_no_kg
  # predictions_file 与 output_dir 会由 run_external_direct_eval 自动填成本实验目录下的路径。
  # 如需显式指定，取消下面注释：
  # predictions_file: data/reports/external_direct_eval_qwen_plus_no_kg/inference/test_out.json
  labels_file: data/finetune/test/input_test_labels_clean.json
  # output_dir: data/reports/external_direct_eval_qwen_plus_no_kg/explanation_eval

judge:
  enabled: true
  model_id: qwen-max
  api_key: ${DASHSCOPE_API_KEY}
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  max_retries: 4
  retry_delay: 2.0
  # output_dir: data/reports/external_direct_eval_qwen_plus_no_kg/judge_eval
