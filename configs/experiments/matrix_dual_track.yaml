experiment:
  name: dual_track_matrix
  output_root: data/reports

training:
  enabled: false

classification_eval:
  enabled: false
  model_name: classifier_baseline
  model_id: models/google/medgemma-27b-text-it
  test_data: data/raw/test_augmented_data.csv
  max_new_tokens: 256

explanation_eval:
  enabled: false
  model_name: reasoning_base
  predictions_file: data/reports/dual_track_matrix/inference/TODO_reasoning_base_out.json

judge:
  enabled: false
  model_id: qwen-max
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  max_retries: 4
  retry_delay: 2.0

matrix:
  variants:
    - name: llama3_raw_no_kg
      patch:
        explanation_eval:
          enabled: true
          model_name: llama3_raw_no_kg
          predictions_file: data/reports/dual_track_matrix/inference/llama3_raw_no_kg_out.json
    - name: llama3_distilled_with_kg
      patch:
        explanation_eval:
          enabled: true
          model_name: llama3_distilled_with_kg
          predictions_file: data/reports/dual_track_matrix/inference/llama3_distilled_with_kg_out.json
    - name: medgemma_with_kg
      patch:
        explanation_eval:
          enabled: true
          model_name: medgemma_with_kg
          predictions_file: data/reports/dual_track_matrix/inference/medgemma_with_kg_out.json
