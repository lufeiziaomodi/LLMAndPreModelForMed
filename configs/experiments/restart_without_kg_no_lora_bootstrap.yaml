experiment:
  name: restart_without_kg_no_lora_bootstrap
  # 新布局：报告都落 data/reports/{experiment_name}/
  output_root: data/reports

training:
  enabled: false
  script: finetune_llama3_ddi.py
  args: []

classification_eval:
  enabled: false

inference:
  enabled: true
  script: inference_llama3_ddi.py
  args:
    - --base_model
    - models/Meta-Llama-3-8B-Instruct
    - --adapter_dir
    - no_lora
    - --input_json
    - data/finetune/test/input_test_reasoning_without_kg.json
    - --labels_json
    - data/finetune/test/input_test_labels_clean.json
    - --output_json
    - data/reports/restart_without_kg_no_lora_bootstrap/inference/llama3_base_explanation_no_kg_no_lora.json
    - --metrics_json
    - data/reports/restart_without_kg_no_lora_bootstrap/inference/llama3_base_explanation_no_kg_no_lora_metrics.json
    - --prompt_mode
    - explanation_without_kg
    - --max_new_tokens
    - "-1"
    - --temperature
    - "0.0"
    - --top_p
    - "1.0"
    - --multi_gpu_shard

explanation_eval:
  enabled: true
  model_name: llama3_base_explanation_no_kg_no_lora
  predictions_file: data/reports/restart_without_kg_no_lora_bootstrap/inference/llama3_base_explanation_no_kg_no_lora.json
  labels_file: data/finetune/test/input_test_labels_clean.json
  label_predictions_file: ""
  output_dir: data/reports/restart_without_kg_no_lora_bootstrap/explanation_eval

judge:
  enabled: false
  model_id: qwen-max
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  max_retries: 4
  retry_delay: 2.0
